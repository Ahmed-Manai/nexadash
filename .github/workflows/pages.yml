name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for the /nexadash/ sub-path
        run: npx ng build --base-href /nexadash/

      # GitHub Pages serves 404.html for unknown paths, which lets the Angular router handle deep links
      - name: Add SPA fallback
        run: cp dist/nexadash/browser/index.html dist/nexadash/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nexadash/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
